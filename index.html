<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Willowmere" />
    <meta name="application-name" content="Willowmere Glade" />
    <meta name="theme-color" content="#2b3a2f" />
    <meta name="format-detection" content="telephone=no" />
    <title>Willowmere Glade</title>
    <!--PWA-->
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2b3a2f;
        position: fixed; inset: 0; overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      #game { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #game canvas { display: block; touch-action: none; -webkit-touch-callout: none; outline: none; }
      #loading {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        font-family: 'Nunito', sans-serif; color: #f6e9c8; font-size: 22px; letter-spacing: 0.08em;
        background: radial-gradient(circle at 50% 45%, #4f6b47, #22301f);
        transition: opacity 0.6s ease; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading">painting the glade…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
